[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guitar-chords"
version = "0.1.0"
description = "Image-based guitar chord classification baseline"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
guitar-chords = "guitar_chords.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
